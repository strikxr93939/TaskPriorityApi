services:
  api:
    build: .
    container_name: task-priority-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Data Source=/data/tasks.db"
    volumes:
      - taskdata:/data
    restart: unless-stopped

volumes:
  taskdata:
